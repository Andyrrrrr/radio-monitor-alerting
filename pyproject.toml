[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vhfwatch"
version = "0.1.0"
description = "Marine VHF Ch 16 distress monitoring — a hobbyist supplemental awareness tool, not a safety system"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  # numpy: PCM audio buffers throughout the pipeline (models.AudioFrame etc.)
  "numpy>=1.26",
  # pydantic + pydantic-settings: typed config with TOML loading and
  # VHFWATCH_* env var override (docs/architecture.md §6)
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # python-ulid: IDs that sort chronologically (docs/conventions.md §3)
  "python-ulid>=2.2",
  # structlog: structured key-value logging (docs/conventions.md §4)
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
  "mypy>=1.10",
]
# Platform extras are placeholders until their phases land dependencies:
# mlx-whisper goes in [macos] and faster-whisper in [linux] with Phase 1
# (docs/roadmap.md). They exist now so the install commands in AGENTS.md
# work from day one.
macos = []
linux = []

[tool.hatch.build.targets.wheel]
packages = ["src/vhfwatch"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Defaults plus: import sorting (I), pyupgrade (UP), common bug patterns (B).
extend-select = ["I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
