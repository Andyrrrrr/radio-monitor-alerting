# DRAFT place-name lists for the response zone. NOT READ BY ANY CODE YET: this file
# only exists so a person can review and correct it before it is wired in.
#
# HOW THE LISTS WOULD BE USED (proposal, to be confirmed):
#   in_territory  -> a call naming one of these keeps its severity (can ring).
#   edge          -> boundary or ambiguous: treated like "unknown", never demoted.
#   out_of_territory -> a call naming one of these, and NO in_territory name, is
#                   capped at WATCH (D34 mechanism). Anything not listed anywhere
#                   is unknown and keeps its severity.
# In-territory wins any tie, so a name that also exists elsewhere (Eagle Harbor,
# Mud Bay, West Point) can only ever PREVENT a demotion, never cause one. That is
# why the in-territory list can safely be generous and the out list must be careful.
#
# SOURCE: named features inside the map extent from OpenStreetMap
# (c) OpenStreetMap contributors, ODbL (openstreetmap.org/copyright), pulled
# 2026-11-02, then filtered by hand. Cross-checked against Wikipedia's San Juan
# Islands island list. The OUT list below is NOT map-derived except the Canadian
# names found inside the map extent; the rest is written from general knowledge.
#
# ZONE: confirmed by the operator 2026-11-02 as the visible map, roughly 48.40-49.00 N,
# 123.13-122.44 W (estimated from landmarks in the screenshot, so +/- a few km), then
# extended west to ~123.24 W to take in the San Juan Island west side (group g_names).
#
# Whisper misspells names. The correct spellings are listed in the sections below;
# how Whisper actually wrote them goes in [aliases], added only from real transcripts.

